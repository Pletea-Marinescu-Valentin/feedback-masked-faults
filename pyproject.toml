[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-masked-faults"
version = "0.1.0"
description = "Detectability and calibrated sequential detection of feedback-masked faults in HVAC control loops"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Valentin Pletea-Marinescu" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
